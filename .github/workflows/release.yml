name: Release plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit lua-sql-sqlite3
      - run: ./test/run.sh
      - name: Package
        run: |
          mkdir lunote.koplugin
          cp *.lua lunote.koplugin/
          cp .env.sample lunote_config.lua.sample LICENSE README.md lunote.koplugin/
          zip -r lunote.koplugin.zip lunote.koplugin
      - uses: softprops/action-gh-release@v2
        with:
          files: lunote.koplugin.zip
